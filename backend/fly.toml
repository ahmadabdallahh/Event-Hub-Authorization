app = 'eventhub-api'
primary_region = 'cai'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[env]
  NODE_ENV = 'production'
  DATA_FILE = '/data/events.json'

[[mounts]]
  source = 'eventhub_data'
  destination = '/data'
  initial_size = '1gb'
